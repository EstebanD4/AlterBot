name: Build & Deploy AlterBot

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: alterbot-bot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Lowercase GitHub owner (Docker requires it)
      # -----------------------------
      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # -----------------------------
      # Docker setup
      # -----------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Build & push bot image
      # -----------------------------
      - name: Build and push AlterBot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./alterbot/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # -----------------------------
      # Upload compose.yml to VPS (as ${VPS_PATH}/compose.yml)
      # -----------------------------
      - name: Upload compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "alterbot/docker/compose.yml"
          target: "${{ secrets.VPS_PATH }}"
          strip_components: 2
          overwrite: true

      # -----------------------------
      # Deploy on VPS
      # -----------------------------
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            mkdir -p "${{ secrets.VPS_PATH }}"
            cd "${{ secrets.VPS_PATH }}"

            # IMPORTANT: if a folder named compose.yml exists from previous runs, remove it
            rm -rf compose.yml

            # If scp didn't land as compose.yml for some reason, try to find it and normalize
            if [ -f "alterbot/docker/compose.yml" ]; then
              mv -f alterbot/docker/compose.yml compose.yml
              rm -rf alterbot
            fi

            # Ensure compose.yml exists
            if [ ! -f "compose.yml" ]; then
              echo "ERROR: compose.yml not found in $(pwd)"
              echo "Directory listing:"
              ls -la
              exit 1
            fi

            OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            # Create runtime .env
            cat > .env << EOF
            GITHUB_OWNER=$OWNER_LC
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            EOF

            # GHCR login (OK if image is private; if public you can remove this)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true

            # Use explicit compose file
            docker compose -f compose.yml pull bot
            docker compose -f compose.yml up -d
            docker image prune -f

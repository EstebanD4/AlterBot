name: Build & Deploy AlterBot

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: alterbot-bot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Lowercase GitHub owner (Docker requires it)
      # -----------------------------
      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # -----------------------------
      # Docker setup + login GHCR
      # -----------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Build & push bot image
      # -----------------------------
      - name: Build and push AlterBot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./alterbot/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # -----------------------------
      # Deploy on VPS (git pull + docker compose)
      # -----------------------------
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}     # root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # Go to repo folder on VPS (must be cloned once)
            cd "${{ secrets.VPS_PATH }}"

            if [ ! -d ".git" ]; then
              echo "ERROR: No git repo found in $(pwd)."
              echo "Clone it once on VPS:"
              echo "  cd ${{ secrets.VPS_PATH }} && git clone https://github.com/EstebanD4/AlterBot.git ."
              exit 1
            fi

            # Update code to latest main
            git fetch --all
            git reset --hard origin/main

            # Write runtime env (.env) from GitHub Secrets
            OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            cat > .env << EOF
            GITHUB_OWNER=$OWNER_LC
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            EOF

            # Move to compose folder (inside repo)
            cd alterbot/docker

            # Sanity checks
            ls -la
            test -f compose.yml

            # Deploy
            docker compose -f compose.yml pull bot
            docker compose -f compose.yml up -d
            docker image prune -f
